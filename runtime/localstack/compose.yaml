# The shared cloud account: one LocalStack for every challenge that needs one.
# No challenge owns this file. A challenge contributes seed/localstack/*.sh,
# which the image bakes in and runs in turn once the API is up, and lists the
# flags that seed reads below.

services:
  localstack:
    image: ${LOCALSTACK_IMAGE:-self-ctf/localstack-seeded:local}
    build:
      context: ../..
      dockerfile: runtime/localstack/Dockerfile
    restart: unless-stopped
    environment:
      # Lambda is deliberately absent - it is the feature that would want the
      # Docker socket mounted.
      SERVICES: secretsmanager,ssm,s3,sts,iam
      DEBUG: "0"
      # Every flag a seed reads. Seeds fail loudly on a missing one, so a flag
      # forgotten here surfaces as an unhealthy stack, not a silent gap.
      FLAG_CLOUD: ${FLAG_CLOUD:?set FLAG_CLOUD in .env}
      FLAG_STATE_CURRENT: ${FLAG_STATE_CURRENT:?set FLAG_STATE_CURRENT in .env}
      FLAG_STATE_PRIOR: ${FLAG_STATE_PRIOR:?set FLAG_STATE_PRIOR in .env}
    ports:
      - "${LOCALSTACK_PORT:?set LOCALSTACK_PORT in .env}:4566"
    healthcheck:
      # Healthy only when every challenge's seed reported success.
      test: ["CMD", "seeds-ready"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
