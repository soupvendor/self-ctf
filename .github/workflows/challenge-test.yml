# Verify every challenge in the repository.
name: Challenge Verification

on:
  pull_request:
  push:
    branches: [main]

# CI generates its own .env, so it needs no repository secrets. Its flags are
# throwaway and unrelated to any real deployment.
jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run terraform:check

  ci:
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - run: mise run env:init

      # Hooks are per-clone opt-in, so CI runs the same checks or a contributor
      # without them installed bypasses everything.
      - run: mise run check

      - run: mise run ci

      - name: Tear down
        if: always()
        run: |
          mise run challenges:down
          mise run down
