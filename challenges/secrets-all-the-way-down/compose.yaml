# Stage 2 (Gitea) and stage 3 (LocalStack). Stage 1 ships as a downloadable
# file, so it has no service here.
#
# Assume a player gets code execution in these containers: no Docker socket, no
# host paths, and no credential that reaches CTFd or another challenge.

services:
  gitea:
    # Rootless variant: the default image starts as root and drops privileges
    # via s6, which leaves PID 1 running as root.
    image: gitea/gitea:1.27.1-rootless
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: ${GITEA_SCHEME:?set GITEA_SCHEME in .env}://${GITEA_HOST_PREFIX?set GITEA_HOST_PREFIX in .env}${CHALLENGE_HOST:?set CHALLENGE_HOST in .env}:${GITEA_PORT:?set GITEA_PORT in .env}/
      GITEA__security__INSTALL_LOCK: "true"
      # Players get in with the account they recover, not one they create.
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    ports:
      - "${GITEA_PORT:?set GITEA_PORT in .env}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 200

  # Runs once per `up`, then exits. Seeding has to be part of the stack rather
  # than a step someone remembers to run, because replacing a broken team stack
  # is the recovery plan.
  gitea-seed:
    image: ${GITEA_SEED_IMAGE:-self-ctf/gitea-seed:local}
    build:
      context: ./runtime/gitea-seed
    depends_on:
      gitea:
        condition: service_healthy
    # Shares Gitea's volumes because `gitea admin user create` is a local CLI
    # against the same app.ini and database - there is no API for the first user.
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    environment:
      GITEA_INTERNAL_URL: http://gitea:3000
      GITEA_ADMIN_NAME: gitea-admin
      GITEA_ADMIN_EMAIL: gitea-admin@internal.local
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:?set GITEA_ADMIN_PASSWORD in .env}
      CI_USER: ${DEPLOY_USER:?set DEPLOY_USER in .env}
      CI_PASS: ${DEPLOY_PASSWORD:?set DEPLOY_PASSWORD in .env}
      FLAG_PIPELINE: ${FLAG_PIPELINE:?set FLAG_PIPELINE in .env}
      LOCALSTACK_PORT: ${LOCALSTACK_PORT:?set LOCALSTACK_PORT in .env}
      LOCALSTACK_SCHEME: ${LOCALSTACK_SCHEME:?set LOCALSTACK_SCHEME in .env}
      LOCALSTACK_HOST_PREFIX: ${LOCALSTACK_HOST_PREFIX?set LOCALSTACK_HOST_PREFIX in .env}
      REPO_NAME: internal-deploy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  localstack:
    # Pinned to the last release that runs without a LocalStack account: the
    # 2026.x stream refuses to start without an auth token.
    image: ${LOCALSTACK_IMAGE:-self-ctf/localstack-seeded:local}
    build:
      context: ./runtime/localstack
    restart: unless-stopped
    environment:
      # Only what stage 3 needs. Lambda is deliberately absent - it is the
      # feature that would want the Docker socket mounted.
      SERVICES: secretsmanager,ssm,s3,sts,iam
      DEBUG: "0"
      FLAG_CLOUD: ${FLAG_CLOUD:?set FLAG_CLOUD in .env}
    ports:
      - "${LOCALSTACK_PORT:?set LOCALSTACK_PORT in .env}:4566"
    healthcheck:
      # Deliberately asserts the seeded secret exists rather than asking
      # LocalStack whether it is up: /_localstack/init/ready answers 200 even
      # when a ready.d script has failed, which would report a stack with an
      # empty Secrets Manager as healthy.
      test:
        [
          "CMD-SHELL",
          "awslocal secretsmanager describe-secret --secret-id platform/break-glass/root-recovery >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  gitea-data:
  gitea-config:
