[tools]
terraform = "1.16.1"
python = "3.12"
uv = "0.12.3"
"pipx:ctfcli" = "0.1.8"

# Stage 3 is an AWS enumeration challenge, so players need this anyway and the
# solver drives LocalStack through it rather than through a second interface.
aws-cli = "2.36.20"

# Code quality. hk drives them as git hooks and in CI; see hk.pkl.
hk = "1.54.1"
ruff = "0.16.2"
"pipx:mypy" = "2.3.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
hadolint = "2.15.1"
actionlint = "1.7.12"
gitleaks = "8.30.1"

[env]
_.file = ".env"

[tasks."env:init"]
description = "Create .env and fill in every secret and flag it is missing"
run = [
  "python3 scripts/mkenv.py",
  "python3 scripts/genflags.py",
]

[tasks.check]
description = "Static checks: lint, format, types, shell, secrets (same set the hooks run)"
run = "hk check --all"

[tasks."terraform:check"]
description = "Validate and mock-test AWS Terraform without credentials or a backend"
run = "bash scripts/check-terraform.sh"

[tasks."platform:check"]
description = "Unit-test platform startup, secret handling, and backup failure paths"
run = "python3 -m unittest discover -s deploy/aws/platform/tests -v"

[tasks."aws:operator"]
description = "Publish AWS runtime images or create/reset/status/destroy a team"
run = "python3 deploy/aws/operator/ctf_aws.py"

[tasks."operator:check"]
description = "Test AWS operator guards and command sequencing without AWS credentials"
run = "python3 -m unittest discover -s deploy/aws/operator -p 'test_*.py' -v"

[tasks."platform:test"]
description = "Test the AWS Compose overlay and restore database/uploads into a fresh local stack"
run = "python3 scripts/test-platform-restore.py"

[tasks."hooks:install"]
description = "Install hk's git hooks in this clone"
run = "hk install"

[tasks.render]
description = "Render *.tmpl into real files using flags from .env"
run = "python3 scripts/render.py"

[tasks."flags:generate"]
description = "Generate a random flag for every FLAG_* placeholder in .env"
run = "python3 scripts/genflags.py"

[tasks.up]
description = "Start the CTFd platform"
run = "docker compose up -d"

[tasks.down]
description = "Stop CTFd and delete all state"
run = "docker compose down -v"

[tasks.logs]
description = "Tail CTFd logs"
run = "docker compose logs -f"

[tasks."challenges:up"]
description = "Start independent challenge bundles; optionally pass a challenge and --team"
depends = ["render", "challenges:images"]
run = "python3 scripts/challenges.py up"

[tasks."challenges:images"]
description = "Build and leak-scan each challenge's isolated runtime images"
run = "python3 scripts/challenges.py images"

[tasks."challenges:down"]
description = "Delete disposable challenge bundles; optionally pass a challenge and --team"
run = "python3 scripts/challenges.py down"

[tasks."challenges:reset"]
description = "Reset one challenge bundle; pass its name and optionally --team"
run = "python3 scripts/challenges.py reset"

[tasks."challenges:logs"]
description = "Read recent challenge logs"
run = "python3 scripts/challenges.py logs"

[tasks."challenges:test"]
description = "Run two-team local solvers, cross-bundle isolation and independent reset checks"
run = "python3 scripts/test-challenge-isolation.py"

[tasks.bootstrap]
description = "Run CTFd's first-time setup and mint an API token for ctfcli"
run = "bash scripts/bootstrap.sh"

[tasks.build]
description = "Build every challenge's player-facing artifact"
depends = ["render"]
run = "bash scripts/build.sh"

[tasks.register]
description = "Write .ctf/config so ctfcli recognises this as a project"
run = "python3 scripts/ctfconfig.py --url $CTFD_URL"

[tasks.lint]
description = "Lint every challenge.yml"
depends = ["render", "register"]
run = """
set -e
for template in challenges/*/challenge.yml.tmpl; do
  [ -f "$template" ] || continue
  dir="${template%/challenge.yml.tmpl}"
  if [ -f "$dir/.expect-flag-in-artifact" ]; then
    # Recovering the flag from the artifact IS this challenge, so ctfcli's
    # distributed-file scan is wrong here. Point it at a string that cannot
    # occur so every other lint check still runs.
    ctf challenge lint "$dir" --flag_format "__no_such_flag_format__"
  else
    ctf challenge lint "$dir"
  fi
done
"""

[tasks."check:leaks"]
description = "Fail if a real flag reaches a build context, dist/, or a shipped image"
run = "python3 scripts/check_leaks.py"

[tasks.sync]
description = "Push challenge metadata to CTFd, installing anything new"
depends = ["render"]
run = "python3 scripts/sync.py"

[tasks.preview]
description = "Sync, then reveal every challenge on the local instance to look at it"
depends = ["sync"]
run = "python3 scripts/preview.py"

[tasks.healthcheck]
description = "Solve every challenge programmatically"
depends = ["render"]
run = """
set -e
for template in challenges/*/challenge.yml.tmpl; do
  [ -f "$template" ] || continue
  dir="${template%/challenge.yml.tmpl}"
  ctf challenge healthcheck "$dir"
done
"""

[tasks.ci]
description = "Full pipeline: build, stand up CTFd, sync, solve every challenge"
run = [
  "mise run render",
  "mise run check",
  "mise run check:leaks",
  "mise run build",
  "mise run lint",
  "mise run up",
  "mise run bootstrap",
  "mise run sync",
  "mise run challenges:up",
  "mise run healthcheck",
]
